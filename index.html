<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Convite</title>

  <!-- conecta com seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- overlay (escurece o fundo) -->
  <div class="overlay"></div>

  <div class="container">
    <h1>Grazi vc sair comigo hoje?</h1>

    <div class="buttons">
      <button id="sim">SIM</button>
      <button id="nao">NÃO</button>
    </div>
  </div>

  <script>
    const nao = document.getElementById("nao");
    const sim = document.getElementById("sim");

    function fugir() {
      const largura = window.innerWidth - nao.offsetWidth;
      const altura = window.innerHeight - nao.offsetHeight;

      const x = Math.random() * largura;
      const y = Math.random() * altura;

      nao.style.position = "fixed";
      nao.style.left = x + "px";
      nao.style.top = y + "px";
    }

    // foge antes de clicar
    nao.addEventListener("mouseenter", fugir);
    nao.addEventListener("click", fugir);

    // botão SIM
    sim.addEventListener("click", () => {
      window.location.href = "https://www.youtube.com/watch?v=eQLxAGEV_6U";
    });
  </script>

</body>
</html>
